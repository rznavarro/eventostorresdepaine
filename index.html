          "@type": "Question",

        {
          "@type": "Question",
          "name": "¿Dónde está Eventos Torres de Paine?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "En Paine, Región Metropolitana, en el km 45 de la Ruta 5 Sur, a unos 40 minutos de Santiago. Es un entorno de campo, a las afueras de la ciudad."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo hacer la ceremonia en el mismo lugar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Pueden casarse al aire libre en nuestra explanada o hacer la ceremonia religiosa en iglesias de la zona. El programa incluye montaje, música en vivo y amplificación para la ceremonia."
          }
        },
        {
          "@type": "Question",
          "name": "¿Tienen menús especiales?",
          "acceptedAnswer": {
            "@type": "Answer",

        },

          "@type": "Question",
          "name": "¿Comparten el lugar con otro evento el mismo día?",
          "acceptedAnswer": {

          }
